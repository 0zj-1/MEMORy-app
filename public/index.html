<!doctype html>
<html lang="zh-Hans">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MEMORy 小程序 demo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap">
<style>
/* Layout: a flow rail beside one phone; every coordinate inside the phone uses the deck's 1125x2000 artboard. */
:root{
  --ground:#1f2416;--rail-text:#e9e2c9;--rail-dim:#a6a68b;--rail-line:#3b4229;
  --cream:#fbf1df;--cream-2:#f3e4c8;--brown:#6b4128;--brown-deep:#4a2c1a;--orange:#ef9a2f;--orange-deep:#c9731a;
  --olive:#8c9068;--gold:#f4c430;--sans:"PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--ground);color:var(--rail-text);font-family:var(--sans);overflow:hidden;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#app{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:56px}
#rail{width:300px;flex:none;max-height:calc(100% - 32px);overflow:auto}
#rail h1{font-size:22px;font-weight:700;margin:0 0 4px}
#rail .sub{font-size:13px;color:var(--rail-dim);line-height:1.6;margin:0 0 20px}
#rail h2{font-size:13px;font-weight:500;color:var(--rail-dim);margin:20px 0 6px}
.step{display:block;width:100%;text-align:left;background:none;border:0;border-left:2px solid var(--rail-line);color:var(--rail-text);font:inherit;font-size:14px;padding:7px 0 7px 12px;cursor:pointer}
.step:hover{background:rgba(255,255,255,.05)}
.step.on{border-left-color:var(--orange);color:var(--orange);font-weight:700}
.tool{display:flex;gap:8px;margin-top:22px;flex-wrap:wrap}
.tool button{background:none;border:1px solid var(--rail-line);color:var(--rail-text);font:inherit;font-size:13px;padding:7px 11px;border-radius:6px;cursor:pointer}
.tool button:hover,.tool button[aria-pressed=true]{border-color:var(--orange);color:var(--orange)}
#phone{position:relative;flex:none;overflow:hidden;background:#111;border-radius:36px;box-shadow:0 0 0 6px #0c0f08}
#stage{position:absolute;left:0;top:0;width:1125px;height:2000px;transform-origin:0 0;overflow:hidden;color:var(--brown-deep);background:#8c9068;font-size:42px;line-height:1.5}
@media (max-width:880px){#rail{display:none}#phone{border-radius:0;box-shadow:none}body{padding:0}}
button{font-family:inherit}
:focus-visible{outline:6px solid #fff;outline-offset:2px}
.bg{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none}
.hot{position:absolute;background:none;border:0;padding:0;cursor:pointer;border-radius:28px;-webkit-tap-highlight-color:transparent}
.hot:active{background:rgba(255,255,255,.18)}
#stage.showhot .hot,#stage.reveal .hot{outline:5px dashed rgba(255,214,102,.95);outline-offset:-5px;background:rgba(255,214,102,.14)}
.page{position:absolute;inset:0;animation:fade .22s ease-out}
@keyframes fade{from{opacity:0}to{opacity:1}}
.bar{position:absolute;left:0;right:0;top:120px;height:120px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:72px;font-weight:700;text-shadow:0 3px 0 rgba(74,44,26,.55)}
.back{position:absolute;left:44px;top:125px;width:110px;height:110px;background:none;border:0;color:#fff;cursor:pointer;display:grid;place-items:center}
.back svg{width:76px;height:76px}
.btn{border:0;cursor:pointer;font-weight:700;font-size:50px;border-radius:999px;min-height:128px;padding:0 44px;background:linear-gradient(#7c4d30,#5c3620);color:#fdf1da;box-shadow:0 7px 0 #3e2414;display:inline-flex;align-items:center;justify-content:center;gap:16px}
.btn:active{transform:translateY(4px);box-shadow:0 3px 0 #3e2414}
.btn.orange{background:linear-gradient(#f7ad4a,#ec8a22);box-shadow:0 7px 0 var(--orange-deep);color:#fff}
.btn.ghost{background:var(--cream);color:var(--brown-deep);box-shadow:inset 0 0 0 4px var(--brown),0 7px 0 #b89c78}
.btn[disabled]{filter:grayscale(.7);opacity:.7;cursor:not-allowed}
.coin{display:inline-block;width:1em;height:1em;border-radius:50%;background:var(--gold);box-shadow:inset 0 0 0 .1em #d99a14,inset 0 0 0 .2em #ffe27a;vertical-align:-.12em;flex:none}
.coins{display:inline-flex;align-items:center;gap:12px;font-weight:700;font-variant-numeric:tabular-nums}
.dock{position:absolute;left:52px;right:52px;bottom:70px;display:grid;grid-template-columns:repeat(4,1fr);gap:22px}
.dock button{height:190px;border-radius:44px;background:var(--cream);border:4px solid var(--brown);box-shadow:0 7px 0 rgba(74,44,26,.55);color:var(--brown-deep);font-weight:700;font-size:40px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.dock button:active{transform:translateY(4px);box-shadow:0 3px 0 rgba(74,44,26,.55)}
.dock svg{width:70px;height:70px}
.roomlayer{position:absolute;inset:0;pointer-events:none}
.sprite{position:absolute;cursor:grab;touch-action:none;user-select:none;-webkit-user-drag:none;pointer-events:auto;height:auto}
.sprite.lifted{cursor:grabbing;filter:drop-shadow(0 14px 8px rgba(40,22,10,.5))}
.gridsvg{position:absolute;left:0;top:0;width:1125px;height:2000px;pointer-events:none}
.gridlines line{stroke:#8a6a3c;stroke-opacity:.38;stroke-width:2}
.foot.good{fill:rgba(126,200,90,.5);stroke:#4f8f2e;stroke-width:4}
.foot.bad{fill:rgba(220,70,50,.5);stroke:#a52d1d;stroke-width:4}
.imgbtn{position:absolute;background:none;border:0;padding:0;cursor:pointer;z-index:950}
.imgbtn img{display:block;width:100%}
.imgbtn:active{transform:translateY(3px)}
.itemchip{position:absolute;left:150px;right:150px;top:128px;min-height:92px;z-index:950;display:flex;align-items:center;justify-content:center;gap:20px;background:rgba(45,28,15,.82);color:#fdf1da;border-radius:999px;padding:6px 24px;font-size:36px;text-align:center}
.itemchip b{font-weight:700}
.itemchip button{flex:none;border:0;background:var(--orange);color:#fff;font-weight:700;font-size:36px;border-radius:999px;padding:12px 28px;cursor:pointer}
.camview{position:absolute;left:50px;top:520px;width:1025px;height:1090px;object-fit:cover;border-radius:60px;background:#111;z-index:2}
.corner-mark{position:absolute;width:90px;height:90px;border:12px solid #fff;z-index:3;pointer-events:none}
.corner-mark.tl{left:80px;top:550px;border-right:0;border-bottom:0;border-top-left-radius:24px}
.corner-mark.tr{left:955px;top:550px;border-left:0;border-bottom:0;border-top-right-radius:24px}
.corner-mark.bl{left:80px;top:1490px;border-right:0;border-top:0;border-bottom-left-radius:24px}
.corner-mark.br{left:955px;top:1490px;border-left:0;border-top:0;border-bottom-right-radius:24px}
.camnote{position:absolute;left:90px;right:90px;top:300px;text-align:center;color:#fff;font-size:42px;font-weight:500;line-height:1.45;text-shadow:0 2px 0 rgba(40,25,14,.55);z-index:4}
.emptyhint{position:absolute;left:150px;right:150px;top:400px;text-align:center;color:#fff;font-size:42px;font-weight:500;line-height:1.5;text-shadow:0 2px 0 rgba(40,25,14,.6)}
.ainote{position:absolute;left:60px;top:448px;width:680px;color:#f6ecd8;font-size:32px;z-index:4;line-height:1.3}
.tag.sample{position:absolute;right:60px;top:440px;z-index:4;cursor:pointer;font-family:inherit}
.convbox{position:absolute;left:162px;top:300px;width:800px;height:800px;border-radius:50px;overflow:hidden;background:#111}
.convbox img{width:100%;height:100%;object-fit:cover;display:block}
.beam.loop{left:0;width:100%;animation:sweepbox 1.8s ease-in-out infinite alternate}
@keyframes sweepbox{from{top:-30px}to{top:770px}}
.convtext{position:absolute;left:60px;right:60px;top:1170px;text-align:center;color:#fff;font-size:60px;font-weight:700}
.convsub{position:absolute;left:90px;right:90px;top:1270px;text-align:center;color:#e3e0c6;font-size:40px}
.pair{position:absolute;left:50px;right:50px;top:360px;display:grid;grid-template-columns:1fr 1fr;gap:30px}
.pair figure{margin:0;display:flex;flex-direction:column;gap:12px;align-items:center;color:#fff;font-size:40px}
.pair img{width:100%;height:560px;object-fit:contain;border-radius:40px;background:#3f4431;display:block}
.pair .after img{background:#f6e2b4}
.steppers{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.stepper{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;justify-items:center;background:#fffaf0;border:4px solid #d8bf97;border-radius:32px;padding:14px 6px;row-gap:6px}
.stepper span{grid-column:1/4;color:#6d543f;font-size:36px}
.stepper b{font-size:54px;min-width:50px;text-align:center}
.stepper button{width:84px;height:84px;border-radius:50%;border:0;background:var(--cream-2);font-size:50px;font-weight:700;color:var(--brown-deep);cursor:pointer;line-height:1}
.card .nm{overflow:hidden;text-overflow:ellipsis}
.sprite.sel{filter:drop-shadow(0 0 7px rgba(255,190,70,.95))}
.sprite.view{cursor:pointer}
.scrim{position:absolute;inset:0;background:rgba(25,18,10,.5);animation:fade .18s;z-index:2000}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--cream);border-radius:70px 70px 0 0;padding:56px 60px 70px;animation:rise .24s ease-out;z-index:31;display:flex;flex-direction:column;gap:30px;max-height:1800px;overflow:hidden}
@keyframes rise{from{transform:translateY(120px);opacity:.3}to{transform:none;opacity:1}}
.sheet.modal{z-index:2001}
.sheet h3{margin:0;font-size:62px;font-weight:700;line-height:1.3}
.sheet p{margin:0;color:#6d543f}
.x{position:absolute;right:44px;top:44px;width:100px;height:100px;border:0;background:var(--cream-2);border-radius:50%;cursor:pointer;color:var(--brown-deep);display:grid;place-items:center;z-index:2}
.x svg{width:50px;height:50px}
.field{display:block;width:100%;font:inherit;font-size:44px;padding:30px 36px;border-radius:32px;border:4px solid #d8bf97;background:#fffaf0;color:var(--brown-deep)}
.field:focus{outline:none;border-color:var(--orange)}
.tabs{display:flex;gap:18px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;height:96px;padding:0 42px;border-radius:999px;border:0;background:#7b6a50;color:#f6ecd8;font-size:44px;font-weight:700;cursor:pointer;white-space:nowrap}
.tab.on{background:var(--cream);color:var(--brown-deep);box-shadow:inset 0 0 0 4px var(--brown)}
.sheet .tab{background:var(--cream-2);color:var(--brown-deep)}
.sheet .tab.on{background:var(--orange);color:#fff;box-shadow:none}
.grid{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:max-content;gap:30px;overflow-y:auto;flex:1;min-height:0;align-content:start;padding:4px 4px 12px}
.card{position:relative;background:var(--cream);border:4px solid var(--brown);border-radius:44px;padding:20px 26px 24px;cursor:pointer;text-align:left;color:var(--brown-deep);box-shadow:0 6px 0 rgba(74,44,26,.4);font:inherit;display:flex;flex-direction:column;gap:10px}
.card .pic{height:var(--pic,290px);display:grid;place-items:center}
.card .pic img{max-width:100%;max-height:var(--pic,290px);display:block}
.card .row{display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:700;font-size:44px;white-space:nowrap}
.card.sel{border-color:var(--orange);box-shadow:0 0 0 5px var(--orange)}
.card .own{font-size:36px;color:#7d6248;font-weight:500}
.empty{grid-column:1/3;text-align:center;padding:90px 40px;color:#6d543f;display:flex;flex-direction:column;align-items:center;gap:36px}
.toast{position:absolute;left:50%;top:280px;transform:translateX(-50%);background:rgba(45,28,15,.94);color:#fdf1da;padding:28px 50px;border-radius:999px;font-size:42px;font-weight:500;z-index:3000;width:max-content;max-width:980px;text-align:center;animation:fade .18s}
.flash{position:absolute;inset:0;background:#fff;z-index:40;animation:flash .45s ease-out forwards;pointer-events:none}
@keyframes flash{from{opacity:.95}to{opacity:0}}
.beam{position:absolute;left:60px;width:1005px;height:70px;top:560px;z-index:5;pointer-events:none;background:linear-gradient(transparent,rgba(120,170,255,.25) 35%,rgba(235,245,255,.95) 50%,rgba(120,170,255,.25) 65%,transparent);animation:sweep 1.5s ease-in-out forwards}
@keyframes sweep{from{top:540px}to{top:1500px}}
.wave{display:flex;align-items:center;justify-content:center;gap:12px;height:160px}
.wave i{display:block;width:16px;background:var(--orange);border-radius:4px;height:var(--h)}
.wave.play i{animation:bar 1s ease-in-out infinite alternate;animation-delay:var(--d)}
@keyframes bar{to{transform:scaleY(.35)}}
.pm{width:170px;height:170px;border-radius:50%;border:0;background:var(--brown);color:#fff;display:grid;place-items:center;cursor:pointer;box-shadow:0 7px 0 #3e2414;flex:none}
.pm svg{width:80px;height:80px}
.pm.rec{background:#c9472f;box-shadow:0 7px 0 #8d2f1e}
.player{display:flex;flex-direction:column;align-items:center;gap:18px}
.clock{font-size:64px;font-weight:700;font-variant-numeric:tabular-nums}
.video{position:relative;border-radius:36px;overflow:hidden;background:#18140e;height:640px}
.video img{width:100%;height:100%;object-fit:cover;display:block}
.video.play img{animation:zoom 14s linear forwards}
@keyframes zoom{to{transform:scale(1.2)}}
.video .pm{position:absolute;left:50%;top:50%;margin:-85px 0 0 -85px;background:rgba(40,25,14,.75);box-shadow:none}
.video .prog{position:absolute;left:0;right:0;bottom:0;height:16px;background:rgba(255,255,255,.3)}
.video .prog b{display:block;height:100%;width:0;background:var(--orange)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:16px}
.seg button{border:4px solid var(--brown);background:var(--cream);color:var(--brown-deep);border-radius:36px;padding:18px 8px;font-size:42px;font-weight:700;cursor:pointer;line-height:1.3}
.seg button small{display:flex;gap:8px;align-items:center;justify-content:center;font-size:32px;font-weight:500}
.seg button.on{background:var(--brown);color:#fff}
.tag{display:inline-block;background:var(--cream);color:var(--brown-deep);border:3px solid var(--brown);border-radius:999px;padding:6px 30px;font-size:38px;font-weight:700;white-space:nowrap}
.mark{position:absolute;width:120px;height:120px;background:none;border:0;cursor:pointer;display:grid;place-items:center;padding:0}
.mark i{display:block;width:52px;height:52px;border-radius:50%;background:#ffb42e;border:7px solid #fff;outline:4px solid #6b4128;box-shadow:0 0 0 0 rgba(255,215,106,.7);animation:pulse 1.6s infinite}
.mark.done i{background:#8bc34a;animation:none}
@keyframes pulse{to{box-shadow:0 0 0 40px rgba(255,215,106,0)}}
.night{position:absolute;inset:0;background:radial-gradient(circle at 18% 12%,#fff 0 3px,transparent 4px),radial-gradient(circle at 74% 9%,#fff 0 2px,transparent 3px),radial-gradient(circle at 88% 26%,#ffe9a8 0 3px,transparent 4px),radial-gradient(circle at 34% 24%,#fff 0 2px,transparent 3px),radial-gradient(circle at 8% 38%,#ffe9a8 0 2px,transparent 3px),linear-gradient(#141a2c 0,#1d2438 38%,#5b6141 78%,#8a8c5c 100%)}
.hint{position:absolute;left:60px;right:60px;bottom:90px;text-align:center;color:#fff;font-weight:500;text-shadow:0 2px 0 rgba(40,25,14,.6)}
.vlist{position:absolute;left:60px;right:60px;top:290px;display:flex;flex-direction:column;gap:44px}
.vcard{display:flex;align-items:center;gap:30px;background:var(--cream);border:4px solid var(--brown);border-radius:50px;padding:26px 40px 26px 26px;box-shadow:0 7px 0 rgba(74,44,26,.45);cursor:pointer;font:inherit;text-align:left;color:var(--brown-deep);width:100%}
.vcard img{width:340px;height:300px;object-fit:contain;flex:none}
.vcard b{display:block;font-size:56px;line-height:1.3}
.vcard span{display:block;font-size:40px;color:#6d543f}
.vcard svg{width:60px;height:60px;flex:none;margin-left:auto}
.nrow{display:flex;gap:26px;align-items:center;padding:28px 0;border:0;border-bottom:3px solid #e6d5b6;background:none;font:inherit;color:inherit;width:100%;text-align:left;cursor:pointer}
.nrow b{display:block;font-weight:700}
.nrow span{display:block;font-size:36px;color:#7d6248}
.demo{font-size:34px;color:#8a6f53}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important}}
</style>

<div id="app">
  <aside id="rail" aria-label="流程导览">
    <h1>MEMORy 线上体验</h1>
    <p class="sub">依 PPT 第四章的界面与流程制作。可以直接点手机画面，也可以从这里跳到任一步。</p>
    <div id="steps"></div>
    <div class="tool">
      <button id="toggleHot" type="button" aria-pressed="false">显示可点区域</button>
      <button id="restart" type="button">重新开始</button>
    </div>
  </aside>
  <main id="phone"><div id="stage"></div></main>
</div>

        var c = el('button', { class: 'vcard', type: 'button', html: '<img src="' + v.img + '" alt=""><div><b>' + v.room + '</b><span>' + v.tag + '・' + v.marks.length + ' 件老物件</span></div>' + svg('arrow'), onclick: function () { go('visit', { id: id }); } });
        list.appendChild(c);
      });
      p.appendChild(list);
    },
    visit: function (p) {
      var id = S.params.id, v = VISITS[id];
      S.seen[id] = S.seen[id] || {};
      function count() { return Object.keys(S.seen[id]).length; }
      if (v.full) p.appendChild(bg(v.full)); else p.appendChild(el('div', { class: 'night' }));
      header(p, v.room, function () { go('visitList'); });
      if (v.full) { p.querySelector('.bar').style.top = '200px'; p.querySelector('.bar').style.fontSize = '58px'; p.querySelector('.back').style.top = '205px'; }
      if (!v.full) p.appendChild(el('img', { src: v.img, alt: v.room, style: 'position:absolute;left:' + v.left + 'px;top:' + v.top + 'px;width:' + (v.scale * (id === 'suwan' ? 490 : 476)) + 'px' }));
      var hint = el('div', { class: 'hint' });
      function upd() { hint.textContent = count() < v.marks.length ? '点亮的老物件都有故事（已看 ' + count() + ' / ' + v.marks.length + '）' : '这个空间的故事都看完了'; }
      v.marks.forEach(function (m, i) {
        var cx = v.full ? m.x : v.left + m.x * v.scale, cy = v.full ? m.y : v.top + m.y * v.scale;
        var b = el('button', { class: 'mark' + (S.seen[id][i] ? ' done' : ''), type: 'button', 'aria-label': m.s.t, style: 'left:' + (cx - 60) + 'px;top:' + (cy - 60) + 'px', html: '<i></i>', onclick: function () { S.lastStory = true; storySheet(m.s, function () { S.seen[id][i] = 1; b.classList.add('done'); upd(); markRail(); }); } });
        p.appendChild(b);
      });
      upd(); p.appendChild(hint);
    }
  };

  function useSample() {
    S.cap = { photo: 'assets/polaroid_big.jpg', sprite: 'assets/polaroid.png', name: '海边的那张照片', f: [1, 1], h: 1, small: true, question: '那天是谁和你一起看的日落？', source: 'sample' };
  }

  /* ---------- flow rail ---------- */
  var FLOW = [
    ['开始', [
      ['注册 / 登录', 'start', function () { go('start'); }],
      ['进入回忆空间', 'enter', function () { go('enter'); }]
    ]],
    ['装扮自己的空间', [
      ['进入自己的空间', 'room', function () { go('room'); }],
      ['扫描上传老物件', 'scan', function () { go('scan'); }],
      ['AI 转换成游戏物件', 'scanResult', function () { if (!S.cap) useSample(); go('scanResult'); }],
      ['添加物件故事', 'edit', function () { if (!S.cap) useSample(); go('edit', { fresh: !S.draft }); }],
      ['摆放物件・装扮空间', 'decorate', function () { go('decorate'); }],
      ['回忆商店', 'shop', function () { go('shop'); }],
      ['我的空间与新角落', 'stack', function () { go('stack'); }],
      ['选择空间主题', 'map', function () { go('map'); }]
    ]],
    ['参观他人的空间', [
      ['选择他人空间', 'visitList', function () { go('visitList'); }],
      ['参观空间、点选老物件', 'visit', function () { go('visit', { id: 'suwan' }); }]
    ]]
  ];
  var steps = document.getElementById('steps');
  FLOW.forEach(function (g) {
    steps.appendChild(el('h2', { text: g[0] }));
    g[1].forEach(function (s) { steps.appendChild(el('button', { class: 'step', type: 'button', 'data-s': s[1], text: s[0], onclick: s[2] })); });
  });
  function markRail() {
    var cur = S.screen === 'convert' ? 'scanResult' : S.screen;
    steps.querySelectorAll('.step').forEach(function (b) { b.classList.toggle('on', b.dataset.s === cur); });
  }
  document.getElementById('toggleHot').addEventListener('click', function () {
    var on = stage.classList.toggle('showhot'); this.setAttribute('aria-pressed', on ? 'true' : 'false');
  });
  document.getElementById('restart').addEventListener('click', function () { S = fresh(); go('start'); });
  stage.addEventListener('click', function (e) {
    if (e.target.closest('button,input,textarea,label,.sprite,.sheet,.itemchip')) return;
    stage.classList.add('reveal'); setTimeout(function () { stage.classList.remove('reveal'); }, 800);
  });

  function fit() {
    var narrow = innerWidth <= 880;
    var aw = narrow ? innerWidth : innerWidth - 300 - 56 - 48, ah = narrow ? innerHeight : innerHeight - 32;
    k = Math.min(aw / W, ah / H);
    phone.style.width = W * k + 'px'; phone.style.height = H * k + 'px';
    stage.style.transform = 'scale(' + k + ')';
  }
  addEventListener('resize', fit); fit();
  ['start', 'enter', 'room_empty', 'scan', 'decorate_empty', 'stack', 'map', 'polaroid_big'].forEach(function (n) { new Image().src = 'assets/' + n + '.jpg'; });
  go('start');
})();
</script>
